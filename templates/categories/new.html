{% extends "base.html" %}

{% block title %}Новая категория — Администрирование{% endblock %}

{% block body %}
<div class="max-w-md mx-auto">
  <div class="mb-6 flex items-center gap-3">
    <a href="/categories" class="btn btn-ghost btn-sm btn-circle">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-base-content">
        <i class="fa-solid fa-plus text-primary mr-2"></i>Новая категория
      </h1>
      <p class="text-base-content/60 text-sm">Создание новой категории тегов</p>
    </div>
  </div>

  {% if error %}
  <div class="alert alert-error mb-4">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <div class="card bg-base-100 shadow-lg">
    <div class="card-body p-6">
      <form action="/categories/new" method="POST" class="space-y-5">

        <!-- Name -->
        <div class="form-control">
          <label class="label" for="name">
            <span class="label-text font-medium">Название категории <span class="text-error">*</span></span>
          </label>
          <label class="input input-bordered flex items-center gap-2">
            <i class="fa-solid fa-folder text-base-content/40"></i>
            <input
              type="text"
              id="name"
              name="name"
              class="grow"
              placeholder="Например: Программирование"
              required
              maxlength="255"
            />
          </label>
        </div>

        <!-- Submit -->
        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn btn-primary flex-1">
            <i class="fa-solid fa-plus mr-2"></i> Создать категорию
          </button>
          <a href="/categories" class="btn btn-ghost">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
