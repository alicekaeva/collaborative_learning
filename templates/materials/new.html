{% extends "base.html" %}

{% block title %}Загрузить материал — Совместное обучение{% endblock %}

{% block body %}
<div class="max-w-xl mx-auto">
  <div class="mb-6 flex items-center gap-3">
    <a href="/materials" class="btn btn-ghost btn-sm btn-circle">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-base-content">
        <i class="fa-solid fa-upload text-primary mr-2"></i>Загрузить материал
      </h1>
      <p class="text-base-content/60 text-sm">Поделитесь учебными материалами</p>
    </div>
  </div>

  {% if error %}
  <div class="alert alert-error mb-4">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <div class="card bg-base-100 shadow-lg">
    <div class="card-body p-6">
      <form action="/materials/new" method="POST" enctype="multipart/form-data" class="space-y-5">

        <!-- Name -->
        <div class="form-control">
          <label class="label" for="name">
            <span class="label-text font-medium">Название материала <span class="text-error">*</span></span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            class="input input-bordered w-full"
            placeholder="Например: Лекция по алгоритмам"
            required
            maxlength="255"
          />
        </div>

        <!-- File upload -->
        <div class="form-control">
          <label class="label" for="file">
            <span class="label-text font-medium">Файл <span class="text-error">*</span></span>
          </label>
          <input
            type="file"
            id="file"
            name="file"
            class="file-input file-input-bordered file-input-primary w-full"
            required
          />
          <label class="label">
            <span class="label-text-alt text-base-content/50">
              Поддерживаются любые типы файлов
            </span>
          </label>
        </div>

        <!-- Privacy toggle -->
        <div class="form-control">
          <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" name="is_private" value="true" class="checkbox checkbox-warning checkbox-sm"/>
            <div>
              <span class="label-text font-medium">Приватный материал</span>
              <p class="text-xs text-base-content/50 mt-0.5">Доступен только вам и администраторам</p>
            </div>
          </label>
        </div>

        <!-- Submit -->
        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn btn-primary flex-1">
            <i class="fa-solid fa-upload mr-2"></i> Загрузить
          </button>
          <a href="/materials" class="btn btn-ghost">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
