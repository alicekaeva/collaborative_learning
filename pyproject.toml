[tool.poetry]
name = "collaborative-learning"
version = "0.1.0"
description = "Collaborative learning REST API"
authors = ["alicekaeva", "Average-epidemiya-enjoyer"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.115.6"
uvicorn = {version = "^0.32.1", extras = ["standard"]}
sqlalchemy = {version = "^2.0.36", extras = ["asyncio"]}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
pydantic = {version = "^2.10.3", extras = ["email"]}
pydantic-settings = "^2.6.1"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
bcrypt = "^4.2.1"
python-multipart = "^0.0.19"
aiofiles = "^24.1.0"
redis = "^5.2.1"
python-slugify = "^8.0.4"
filetype = "^1.2.0"
httpx = "^0.28.1"
jinja2 = "^3.1.4"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
ruff = "^0.15.7"
mypy = "^1.19.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
